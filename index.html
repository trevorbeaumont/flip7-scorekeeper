<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flip 7 Score Keeper</title>
<meta name="description" content="Fast, offline score keeper for the Flip 7 card game. Tap your cards, bank your points, and see who's winning.">
<meta name="theme-color" content="#f4f2ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0e16" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flip 7">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">
<link rel="stylesheet" href="styles.css">
<script>
  // Apply the saved theme before first paint to avoid a flash.
  try{var t=JSON.parse(localStorage.getItem('flip7.prefs.v1')||'{}').theme;if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}
</script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">7</span>Flip 7 <small>scores</small></div>
    <div class="topbar-actions">
      <button id="undo-btn" class="icon-btn" data-action="undo" hidden aria-label="Undo"></button>
      <button class="icon-btn" data-action="menu" aria-label="Menu"></button>
    </div>
  </header>
  <main id="view"></main>
</div>

<nav id="tabbar" class="tabbar" hidden aria-label="Views">
  <div class="inner">
    <button class="tab" data-action="tab" data-tab="board"></button>
    <button class="tab" data-action="tab" data-tab="history"></button>
    <button class="tab" data-action="tab" data-tab="stats"></button>
  </div>
</nav>

<dialog id="sheet" class="sheet" aria-label="Enter score"></dialog>
<dialog id="menu" class="sheet" aria-label="Menu"></dialog>
<dialog id="confirm" class="modal"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="update-bar" class="update-bar" hidden>New version ready <button data-action="apply-update">Reload</button></div>

<noscript><p style="padding:24px;text-align:center">Flip 7 Score Keeper needs JavaScript enabled.</p></noscript>
<script src="app.js"></script>
</body>
</html>
